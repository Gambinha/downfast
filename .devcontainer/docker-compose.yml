services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      - frontend-node-modules:/workspace/downFast_frontend/node_modules
      - server-node-modules:/workspace/server/node_modules
      - ${HOME}/.claude:/root/.claude:cached
    command: sleep infinity
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/downfast
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "3333:3333"
    networks:
      - downfast-net

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: downfast
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - downfast-net

volumes:
  postgres-data:
  frontend-node-modules:
  server-node-modules:

networks:
  downfast-net:
    driver: bridge
